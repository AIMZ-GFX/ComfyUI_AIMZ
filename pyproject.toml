[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui_aimz"
version = "0.1.3"
description = "A versatile collection of essential workflow helper and utility nodes for ComfyUI by AIMZ / CEC Tools."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AIMZ" }
]
dependencies = [
    "torch",
    "numpy",
    "pillow"
]

[project.urls]
Repository = "https://github.com/AIMZ-GFX/ComfyUI_AIMZ"

[tool.comfy]
PublisherId = "aimz-media"
DisplayName = "ComfyUI_AIMZ"
Icon = ""
